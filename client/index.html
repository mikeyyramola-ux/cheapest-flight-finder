<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!--app-head-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0d0e13" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- CONSENT GATE (owner-ordered 2026-09-27, ahead of GSC/HF work): the AdSense
         loader below is NOT static any more. It is injected only after the visitor
         picks "Accept all" in the banner, because personalised ads on EEA/UK traffic
         need prior opt-in. Choice lives in localStorage fareloop_consent_v1.
         Decline keeps the loader off for good; analytics (umami, cookieless) stays. -->
    <script>
      (function () {
        var KEY = "fareloop_consent_v1";
        var ADSENSE = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9813771409374534";
        function read() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
        function write(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
        window.fareloopConsent = { get: read, set: write };
        function loadAds() {
          if (document.getElementById("adsense-loader")) return;
          var s = document.createElement("script");
          s.id = "adsense-loader";
          s.async = true;
          s.crossOrigin = "anonymous";
          s.src = ADSENSE;
          document.head.appendChild(s);
        }
        function banner() {
          if (document.getElementById("fl-consent")) return;
          var box = document.createElement("div");
          box.id = "fl-consent";
          box.setAttribute("role", "dialog");
          box.setAttribute("aria-label", "Privacy choices");
          box.style.cssText = "position:fixed;left:16px;right:16px;bottom:16px;z-index:9999;" +
            "max-width:660px;margin:0 auto;padding:16px 18px;border-radius:14px;background:#15171d;" +
            "border:1px solid rgba(185,255,152,.28);color:rgba(255,255,255,.84);" +
            "font:14px/1.55 'DM Sans',system-ui,sans-serif;box-shadow:0 18px 44px rgba(0,0,0,.55)";
          box.innerHTML =
            '<strong style="display:block;margin-bottom:6px;color:#b9ff98">Your privacy choices</strong>' +
            'Fareloop shows ads through Google AdSense, which may store identifiers for ad ' +
            'personalisation <em>only</em> if you accept. Our analytics (umami) is cookieless. ' +
            'Details in the <a href="/privacy.html" style="color:#b9ff98;text-decoration:underline">privacy policy</a>.' +
            '<div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">' +
            '<button id="fl-accept" style="flex:1;min-height:40px;border:0;border-radius:10px;' +
            'background:#b9ff98;color:#10210d;font-weight:800;cursor:pointer">Accept all</button>' +
            '<button id="fl-decline" style="flex:1;min-height:40px;border-radius:10px;background:transparent;' +
            'color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.28);font-weight:700;' +
            'cursor:pointer">Decline</button></div>';
          document.body.appendChild(box);
          document.getElementById("fl-accept").onclick = function () {
            write("all"); box.parentNode.removeChild(box); loadAds();
          };
          document.getElementById("fl-decline").onclick = function () {
            write("essential"); box.parentNode.removeChild(box);
          };
        }
        if (read() === "all") { loadAds(); }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", function () { if (!read()) banner(); });
        } else if (!read()) { banner(); }
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
